name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, contrast, registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - name: Contrast (every theme and tone, light and dark)
        run: pnpm check:contrast

      - name: Registry is up to date
        run: |
          pnpm registry:build
          git diff --exit-code -- registry.json public/r app/ds-tokens.css components/demos/index.ts \
            || (echo "::error::Run 'pnpm registry:build' and commit the result." && exit 1)

  # The UI audit (layout checks + axe accessibility) covers ~80 pages at two
  # widths in two themes: split across 4 parallel jobs, each building the app.
  audit:
    name: UI audit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: UI audit (alignment, overflow, popups, names, console, axe)
        run: pnpm audit:ui
        env:
          AUDIT_SHARD: ${{ matrix.shard }}/4

  registry-install:
    name: Registry installs into a fresh project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build

      # shadcn rewrites registry CSS when installing (it once broke nested @media);
      # install the local registry into a new app and build it.
      - name: Install the registry into a new Next app
        working-directory: ${{ runner.temp }}
        run: |
          npx -y shadcn@4.23.0 init -t next -b base -p nova -n consumer --no-monorepo -y
          mkdir consumer/r
          cp "$GITHUB_WORKSPACE"/public/r/*.json consumer/r/
          sed -i 's#https://raw.githubusercontent.com/renanleonel/design-system/main/public/r/#./r/#g' consumer/r/*.json
          cd consumer
          npx -y shadcn@4.23.0 add ./r/base.json ./r/app-shell.json ./r/data-table.json ./r/settings.json ./r/billing.json ./r/auth.json -y --overwrite
          npx tsc --noEmit
      - name: Build the consumer
        working-directory: ${{ runner.temp }}/consumer
        run: npx next build
